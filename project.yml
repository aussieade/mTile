name: mTile
options:
  bundleIdPrefix: com.mtile
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  mTile:
    type: application
    platform: macOS
    sources:
      - mTile
    settings:
      base:
        INFOPLIST_FILE: mTile/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: mTile/Resources/mTile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mtile.app
        PRODUCT_NAME: mTile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts

  mTileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - mTileTests
    dependencies:
      - target: mTile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mtile.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mTile.app/Contents/MacOS/mTile"
        BUNDLE_LOADER: "$(TEST_HOST)"
